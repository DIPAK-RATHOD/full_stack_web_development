<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Tip Calculator</h1>
        <form id="tip-form">
            <div class="field">
                <label for="bill-amount">Bill Amount ($)</label>
                <input type="number" id="bill-amount" min="0" step="0.01" placeholder="0.00" required />
            </div>

            <div class="field">
                <label for="tip-percentage">Tip Percentage (%)</label>
                <input type="number" id="tip-percentage" min="0" max="100" step="1" placeholder="15" required />
            </div>

            <button type="button" id="calculate">Calculate</button>
        </form>

        <div id="results" class="hidden">
            <p>Tip: <span id="tip-amount">$0.00</span></p>
            <p>Total: <span id="total-amount">$0.00</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
