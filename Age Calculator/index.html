<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Age Calculator</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="card" role="main">
		<h1>Age Calculator</h1>
		<p>Enter a birthdate to calculate your exact age in years, months, and days.</p>

		<label for="birthdate">Birthdate</label>
		<input id="birthdate" type="date" aria-label="Birthdate" />

		<button id="calc">Calculate Age</button>

		<div id="error" class="error" aria-live="polite"></div>
		<div id="output" class="result" aria-live="polite" hidden></div>
	</main>

	<script src="script.js"></script>
</body>
</html>
